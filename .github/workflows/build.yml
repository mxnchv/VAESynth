name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Universal binary: Apple Silicon + Intel
            configure_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            configure_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVAESYNTH_BUILD_TESTS=ON ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign and add installer (macOS)
        if: runner.os == 'macOS'
        working-directory: build/VAESynth_artefacts/Release
        run: |
          for bundle in VST3/VAESynth.vst3 AU/VAESynth.component CLAP/VAESynth.clap Standalone/VAESynth.app; do
            codesign --force --deep --sign - "$bundle"
          done
          cp "$GITHUB_WORKSPACE/packaging/macos/install.sh" .

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: VAESynth-${{ matrix.name }}
          path: |
            build/VAESynth_artefacts/Release/VST3
            build/VAESynth_artefacts/Release/AU
            build/VAESynth_artefacts/Release/CLAP
            build/VAESynth_artefacts/Release/Standalone
            build/VAESynth_artefacts/Release/install.sh
          if-no-files-found: error
